services:
  playground: 
    build:
      dockerfile: ./Dockerfile
      context: .
    volumes:
      - .:/singullar
    networks:
      - internal
    env_file:
      - "./secrets/app.env"
      - "./secrets/api.env"
      - "./secrets/client.env"
      - "./secrets/postgres.env"
      - "./secrets/server.env"
    ports:
      - "8080:80"

  api:
    build: 
      dockerfile: ./internal/api/Dockerfile
      context: .
    env_file:
      - "./secrets/client.env"
      - "./secrets/postgres.env"
      - "./secrets/api.env"
      - "./secrets/app.env"
    ports:
      - "8000:80"
    depends_on:
      - db
    networks:
      - internal

  db:
    image: postgres:17.5
    volumes: 
      - db_data:/var/lib/postgresql/data
    env_file:
      - "./secrets/postgres.env"
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
    driver: bridge